name: ci
on:
  push:
    branches: [main]
  pull_request:
  # 出口条件（exit-criteria・cross-os）は重いので push では走らせない。手動の起動と夜間（03:00 JST）だけ
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

# 続けて push したときは、同じ ref の古い実行を取り消す（実行時間を使い過ぎない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check
      # 契約テスト（tests/contract_fixtures）の F-PY（httpx）・F-TS（ky）を先に取る。取らなくても conftest が取りにいき、
      # 失敗すれば赤にする（BUG-0062: skip は pass ではない）。取得の失敗を試験の赤と分けて見るために別の段にする
      - run: uv run --no-project python bench/fetch_fixtures.py
      - run: uv run pytest -q

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # 仕様書 L-8: 依存木のライセンスを許可リストと照合
      - run: uv run python tools/check_licenses.py
      # 仕様書 L-7: THIRD_PARTY_NOTICES.md は生成物。uv.lock と導入済みの配布情報から作り直して差分が無いこと
      - run: uv run python tools/gen_notices.py --check
      # 仕様書 M1-8: 配布物（wheel と sdist）に LICENSE と THIRD_PARTY_NOTICES.md が入ること
      - run: uv build --out-dir dist
      - run: uv run python tools/check_dist.py dist

  # 仕様書 M1-7（§15.2）: Windows / macOS / Linux で M1-1〜M1-6 が同じ結果になる。
  # 出口条件の実行器を 3 OS で走らせて結果 JSON を上げ（exit-criteria）、集めて比べる（cross-os）。
  # 実 LSP は uv sync が入れる basedpyright と ruff だけ。typescript-language-server は入れない
  # （3 OS で入れ方を揃えられないと、差が製品の差か入れ方の差か分からなくなる）。無い LSP の試験は skip になり、
  # その件数と理由が結果 JSON と .pair-agent/acceptance/M1-exit-*.md に残る。
  exit-criteria:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen --python 3.12
      # リポジトリに入っている過去の *-exit.json を成果物と実行器の M1-7.cross-os に混ぜない
      - name: 過去の exit 結果を除く
        shell: bash
        run: rm -f bench/results/*-exit.json
      - name: M1 の出口条件を走らせる（--skip-slow）
        shell: bash
        run: |
          set +e
          uv run --frozen python bench/run_exit_criteria.py --skip-slow
          rc=$?
          echo "run_exit_criteria.py の終了コード: $rc"
          # 1 = 出口条件のどれかが不合格・未整備（現在地。この OS 単独では M1-7 は常に未整備）。
          # 3 OS の一致は cross-os ジョブが判定する。2 以上は実行器自体の失敗なのでここで落とす
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: exit-${{ matrix.os }}
          path: |
            bench/results/*-exit.json
            .pair-agent/acceptance/M1-exit-*.md
          if-no-files-found: error

  cross-os:
    needs: exit-criteria
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: exit-*
          path: exit-artifacts
          merge-multiple: true
      # 標準ライブラリだけの台本なので uv sync は要らない。0 = 一致、1 = 不一致、2 = 3 OS の結果が揃わない
      - name: 3 OS の結果を比べる（M1-7）
        shell: bash
        run: |
          set +e
          uv run --no-project python bench/compare_cross_os.py exit-artifacts --json cross-os.json > cross-os.md
          rc=$?
          cat cross-os.md
          cat cross-os.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cross-os
          path: |
            cross-os.md
            cross-os.json
