[project]
name = "lucianke"
version = "0.0.1"
description = "Deterministic code-knowledge MCP server for coding agents (Tree-sitter + LSP + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Shinichi Oka" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "tree-sitter-json",
  "tree-sitter-yaml",
  "tree-sitter-toml",
  "tree-sitter-xml",
  "tree-sitter-markdown",
  "watchfiles>=1.3",
  "PyYAML>=6",
  "jsonpath-ng>=1.14",
  "dulwich>=1.2",
]

[project.optional-dependencies]
langs = [
  "tree-sitter-rust",
  "tree-sitter-go",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-rst",
  "tree-sitter-sql",
]
python = ["basedpyright", "ruff"]
edit = ["ast-grep-py"]
verify = ["z3-solver", "sqlglot"]
xml = ["lxml"]
all = ["lucianke[langs,python,edit,verify,xml]"]

[project.scripts]
lucianke = "lucianke.__main__:main"

[dependency-groups]
# dev は `uv run` / `uv sync` が既定で入れる組（uv の default-groups の既定は ["dev"]）。
# langs の文法はテストが無条件に import する（tests/unit/test_syntax_boundaries.py の tree_sitter_rust など）ので、
# 新しい .venv でも `uv run pytest` だけで全体テストに届くように dev に含める（BUG-0062）。
# 利用者向けの optional extra `langs` はそのまま残す（配布物の既定依存は増やさない）。
dev = [
  "lucianke[langs]",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.17",
  "basedpyright>=1.40",
  "pip-licenses>=5.5",
  "ast-grep-py>=0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucianke"]

# sdist は明示の許可リスト（.claude・.pair-agent・.mcp.json などの作業用ファイルを配布しない）。
# LICENSE と THIRD_PARTY_NOTICES.md は license-files と合わせて必ず入る。検査は tools/check_dist.py（CI の license ジョブ）。
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/docs",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", ".venv", "spikes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes", "tests/fixtures/poly"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S602", "S604", "S605"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
