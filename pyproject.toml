[project]
name = "lucianke"
version = "0.0.1"
description = "Deterministic code-knowledge MCP server for coding agents (Tree-sitter + LSP + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shinichi Oka" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "tree-sitter-json",
  "tree-sitter-yaml",
  "tree-sitter-toml",
  "tree-sitter-xml",
  "tree-sitter-markdown",
  "watchfiles>=1.3",
  "PyYAML>=6",
  "jsonpath-ng>=1.14",
  "dulwich>=1.2",
]

[project.optional-dependencies]
langs = [
  "tree-sitter-rust",
  "tree-sitter-go",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-rst",
  "tree-sitter-sql",
]
python = ["basedpyright", "ruff"]
edit = ["ast-grep-py"]
verify = ["z3-solver", "sqlglot"]
xml = ["lxml"]
all = ["lucianke[langs,python,edit,verify,xml]"]

[project.scripts]
lucianke = "lucianke.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.17",
  "basedpyright>=1.40",
  "pip-licenses>=5.5",
  "ast-grep-py>=0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucianke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", ".venv", "spikes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes", "tests/fixtures/poly"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S602", "S604", "S605"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
