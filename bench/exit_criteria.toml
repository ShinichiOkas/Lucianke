criterion = "M1-1"
spec = "§11 各ツールの「事後条件」、設計書 R-9"
title = "事後条件の番号 -> 契約テストの対応表を機械で作り、対応の無い事後条件が 0 であること"
kind = "script"
cmd = ["{py}", "bench/postcondition_map.py", "--m1-only", "--json", "{out}", "--quiet"]
pass = "M1 の 14 ツールの事後条件のうち、テストに結び付かないもの（unmapped）が 0 件"
expect = [
  { path = "unmapped_total", op = "eq", value = 0 },
]
slow = false
timeout_s = 120
est_min = 0.1
requires_files = ["bench/postcondition_map.py"]

[[check]]
id = "M1-1.tool-t01-get_repo_map"
criterion = "M1-1"
spec = "§11.2 T-01 `get_repo_map`（M1 の 14 ツールの 1 本）"
title = "T-01 の実装と契約テストがある（tools/t01_*.py と repo_map を名前に持つ契約テスト）"
kind = "pytest"
cmd = ["tests/contract", "-k", "repo_map"]
pass = "T-01 の実装ファイルが在り、repo_map を名前に持つ契約テストが 1 件以上通る"
min_tests = 1
slow = false
