[[check]]
id = "M1-1.contract-fpy-fts"
criterion = "M1-1"
spec = "§14.2 F-PY・F-TS（bench/fixtures.toml）、§15.2 M1-1"
title = "F-PY（httpx）と F-TS（ky）に対して契約テストを回す仕組み"
kind = "pytest"
cmd = ["tests/contract_fixtures"]
pass = "取得済みの F-PY・F-TS を対象に、14 ツールの事後条件の試験が通る（契約テストを F-POLY 以外のワークスペースで回す仕組みが前提）"
min_tests = 28
skips = "fail"
slow = true
timeout_s = 1800
est_min = 10
needs = ["fixture:F-PY", "fixture:F-TS"]
requires_files = ["tests/contract_fixtures"]
# 整備済み（BUG-0036、2026-10-29）: tests/contract_fixtures/ が F-PY・F-TS を tmp_path に複製して結線済みのサーバー（RuntimeHub + LspPool +
# Pipeline）を組み、T-00〜T-08・T-10・T-11・T-13・T-19・T-20 の事後条件を確かめる。取得されていなければ rig が理由つきで skip する（skips = "fail" が未検証と扱う）。
# TypeScript の LSP が無い環境の F-TS は、exact 水準だけが条件の事後条件を降格応答の約束で確かめる（BUG-0057）。

