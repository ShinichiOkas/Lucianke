min_tests = 100
skips = "report"
slow = false
timeout_s = 1500
est_min = 6
lsp = ["ruff", "basedpyright"]

[[check]]
id = "M1-1.e2e-stdio"
criterion = "M1-1"
spec = "§11、§12.1（実プロセスの stdio 経由で 14 ツールが答える）"
title = "実プロセスのサーバーに stdio でつなぐ縦串（tools/list と索引ツール）"
kind = "pytest"
cmd = ["tests/e2e"]
pass = "tests/e2e が全部通る"
min_tests = 1
slow = false
timeout_s = 600
est_min = 2

[[check]]
