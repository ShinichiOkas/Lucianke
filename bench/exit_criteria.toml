# M1 の出口条件（仕様書 §15.2 の M1-1〜M1-8）を、機械で判定できる検査に分解した一覧。
# 設計書 §10.6 / §12.2 タスク 12 の成果物。実行器は bench/run_exit_criteria.py（人手の検査は無い。§14.1）。
#
# 使い方:
#   uv run python bench/run_exit_criteria.py                 # 全部
#   uv run python bench/run_exit_criteria.py --skip-slow     # slow = true を飛ばす（数分で終わる）
#   uv run python bench/run_exit_criteria.py --only M1-2     # 出口条件の番号（M1-5）・検査の id（M1-5.ops1-stdout）・接頭辞
#
# 検査（[[check]]）の項目:
#   id         一意。"M1-<番号>.<名前>"
#   criterion  対応する出口条件（M1-1〜M1-8）。"REF" は出口条件に含まれない参考（gating = false）
#   spec       仕様書の根拠（章・要求 ID）
#   title      何を確かめるか（1 行）
#   kind       pytest | script | builtin
#                pytest  : cmd は pytest の引数（ノード ID・ディレクトリ・-k）。junit-xml で件数と赤いノードを取る
#                script  : cmd は argv。{py} は実行器の Python、{out} は結果 JSON の一時パス。終了コード 0 で合格
#                          + expect があれば、結果ファイル（result_kind のもの、または {out}）を判定する
#                builtin : 実行器に組み込んだ検査（builtin = "<名前>"）
#   pass       合格の条件（人が読む文。判定は kind / expect / min_tests / skips がやる）
#   expect     結果 JSON の判定。path は "." 区切り、"*" は辞書の値・配列の要素の全部。op は
#                eq（全部が value）/ in（全部が value の中）/ count_ge（個数が value 以上）/ contains_all（集合が value を含む）/ ge / le
#   min_tests  pytest: 走った件数の下限（0 件で「合格」にしない。既定 1）
#   skips      pytest: "report"（既定。件数と理由を載せる）| "fail"（skip が 1 件でもあれば不合格＝未検証）
#   slow       true なら --skip-slow で飛ばす
#   timeout_s  1 検査の上限秒（超えたら process tree ごと止めて timeout）
#   est_min    所要の目安（分。2026-10-29 の Windows 機での実測。負荷で変わる）
#   needs      機械で調べる前提: fixture:F-PY / fixture:F-TS（bench/fetch_fixtures.py で取得済みか）/ exe:<名前>（PATH にあるか）
#   requires_files    これが無ければ「未整備」（まだ作られていない成果物）
#   requires_tracked  作業ツリーにあっても git の管理下に無ければ「未整備」（他の役が未コミット）
#   quiet      true なら「同時に他の負荷を掛けない状態」が前提（§14.4）。CPU 使用率を記録し、高ければ注意を付ける
#   lsp        どの LSP が要るか（記録用。無ければ skip になる試験があるので skips で見る）
#   gating     false なら出口条件の合否に数えない（参考）
#
# 判定の語: pass 合格 / fail 不合格 / timeout 上限超過 / error 実行できなかった /
#           missing 未整備（成果物が無い・未コミット）/ blocked 前提が満たせない / skipped 今回は走らせていない

[meta]
spec = "docs/Lucianke仕様書.md §15.2（M1-1〜M1-8）、第 14 章"
design = "docs/Lucianke アーキテクチャ設計書.md §10.6、§12.2 タスク 12"
network = "none"        # 検査の実行中に外向き通信はしない（フィクスチャの取得だけ別: bench/fetch_fixtures.py）
manual_checks = 0       # 人手の検査は作らない（§14.1）

